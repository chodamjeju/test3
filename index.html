  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="귤슐랭 제주 — 제주 한 바퀴, 맛있는 곳만 콕.">
  <meta name="twitter:description" content="제주 읍면동별 맛집을 지도에서 찾고 나만의 방문 도장을 모아보세요.">
  <meta name="twitter:image" content="https://gyulchelin-jeju.hagyul55.chatgpt.site/assets/og.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='11' fill='%23ff7a1a'/%3E%3Cpath d='M16 8c1-4 5-5 8-3-1 3-4 5-8 3Z' fill='%231f6b4f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="귤슐랭 제주 홈">
      <span class="brand-fruit" aria-hidden="true">●</span>
      <span>귤슐랭 제주</span>
    </a>
    <div class="trip-progress" aria-live="polite">
      <span class="progress-label">나의 도장깨기</span>
      <strong><span id="stampCount">0</span> / <span id="totalRestaurants">128</span></strong>
      <span class="progress-track"><span id="progressFill"></span></span>
    </div>
  </header>

  <main class="app-shell">
    <section class="map-panel" aria-labelledby="mapTitle">
      <div class="map-copy">
        <div>
          <p class="eyebrow">JEJU FOOD MAP</p>
          <h1 id="mapTitle">제주 한 바퀴,<br>맛있는 곳만 콕.</h1>
        </div>
        <button class="reset-button" id="resetMap" type="button" hidden>← 제주 전체</button>
      </div>

      <div class="map-stage" id="mapStage">
        <div class="sea-label sea-label-a">협재 해변</div>
        <div class="sea-label sea-label-b">성산 일출봉</div>
        <div class="island" id="islandMap" aria-label="제주도 지역별 맛집 지도">
          <span class="mountain" aria-hidden="true"></span>
          <div id="regionButtons"></div>
          <div id="subregionButtons"></div>
        </div>
        <div class="map-total" id="mapTotal">
          <span>제주 전역</span>
          <strong>맛집 128곳</strong>
        </div>
      </div>
      <p class="map-guide" id="mapGuide">궁금한 지역을 누르면 읍·면·동 맛집 수를 볼 수 있어요.</p>
    </section>

    <section class="list-panel" aria-labelledby="listTitle">
      <div class="list-head">
        <div>
          <p class="eyebrow dark" id="areaLabel">제주 전체</p>
          <h2 id="listTitle">지금 제주에서 사랑받는 맛집</h2>
        </div>
        <span class="result-count" id="resultCount">6곳</span>
      </div>

      <div class="category-row" role="group" aria-label="음식 종류 필터">
        <button class="category active" data-category="전체" type="button">전체</button>
        <button class="category" data-category="흑돼지" type="button">흑돼지</button>
        <button class="category" data-category="해산물" type="button">해산물</button>
        <button class="category" data-category="국수" type="button">국수</button>
        <button class="category" data-category="카페" type="button">카페</button>
      </div>

      <div class="restaurant-list" id="restaurantList"></div>
      <div class="empty-state" id="emptyState" hidden>
        <span>🍊</span>
        <strong>이 조건의 맛집은 준비 중이에요.</strong>
        <button type="button" id="clearFilter">전체 맛집 보기</button>
      </div>
    </section>
  </main>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <aside class="detail-sheet" id="detailSheet" aria-hidden="true" aria-labelledby="restaurantName">
    <button class="sheet-close" id="closeSheet" type="button" aria-label="식당 상세 닫기">×</button>
    <div class="detail-photo-wrap">
      <img src="assets/jeju-table.png" alt="제주 흑돼지와 전복, 고기국수가 차려진 식탁">
      <span class="photo-chip" id="detailCategory">흑돼지</span>
    </div>
    <div class="detail-body">
      <p class="eyebrow dark" id="detailArea">애월읍</p>
      <div class="detail-title-row">
        <div>
          <h2 id="restaurantName">애월 노을식탁</h2>
          <p id="detailMeta">★ 4.8 · 리뷰 127</p>
        </div>
        <label class="stamp-toggle">
          <input type="checkbox" id="detailStamp">
          <span>도장깨기</span>
        </label>
      </div>
      <p class="restaurant-description" id="detailDescription"></p>

      <div class="review-head">
        <h3>방문 후기 <span id="reviewCount">7</span></h3>
        <span>최신순</span>
      </div>
      <div class="review-list" id="reviewList"></div>
      <button class="more-button" id="showMoreReviews" type="button">후기 더보기</button>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
